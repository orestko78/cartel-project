
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Готелі — CARTEL у Буковелі</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="hotels-page">

    <!-- 🏛️ Преміум-шапка CARTEL -->
    <div id="header-placeholder"></div>

    <section class="hero">
        <h1 data-i18n="hotels_hero_title">Наші готелі у <span>Буковелі</span></h1>
        <p data-i18n="hotels_hero_desc">Затишні номери, високий рівень сервісу та неймовірні пейзажі Карпат для вашого ідеального відпочинку.</p>
    </section>  

    <div class="container">
        <div class="grid" id="establishments-grid">
            <!-- Сюди автоматично завантажуються картки готелів -->
        </div>
    </div>

    <!-- ✨ Модальне вікно бронювання -->
    <div class="modal-overlay" id="booking-modal-overlay">
        <div class="modal">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h2 id="modal-title">Резерв номера</h2>
            <div class="modal-subtitle" id="modal-establishment-name">Назва готелю</div>
            
            <form id="booking-form" onsubmit="submitBooking(event)">
                <input type="hidden" id="form-establishment-name">
                <div class="form-group">
                    <label>Ваше ім'я</label>
                    <input type="text" id="guest-name" required placeholder="Орест">
                </div>
                <div class="form-group">
                    <label>Номер телефону</label>
                    <input type="tel" id="guest-phone" required placeholder="+380">
                </div>
                <div class="form-group">
                    <label>Дата заїзду та виїзду</label>
                    <input type="datetime-local" id="booking-date" required>
                </div>
                <button type="submit" class="btn-submit">Підтвердити бронь</button>
            </form>
        </div>
    </div>

    <script>
        // 1. Словник перекладів
        const translations = {
            uk: {
                nav_about: "Про нас",
                nav_restaurants: "Ресторани",
                nav_hotels: "Готелі",
                nav_spa: "SPA",
                nav_team: "Команда",
                nav_jobs: "Вакансії",
                nav_blog: "Блог",
                nav_contact: "Контакти",
                hotels_hero_title: "Наші готелі у Буковелі",
                hotels_hero_desc: "Затишні номери, високий рівень сервісу та неймовірні пейзажі Карпат для вашого ідеального відпочинку."
            },
            en: {
                nav_about: "About Us",
                nav_restaurants: "Restaurants",
                nav_hotels: "Hotels",
                nav_spa: "SPA",
                nav_team: "Team",
                nav_jobs: "Careers",
                nav_blog: "Blog",
                nav_contact: "Contacts",
                hotels_hero_title: "Our Hotels in Bukovel",
                hotels_hero_desc: "Cozy rooms, high-level service, and incredible Carpathian landscapes for your ideal getaway."
            }
        };

        // 2. Функція зміни мови
        function setLanguage(lang) {
            localStorage.setItem('cartel_lang', lang);
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    element.textContent = translations[lang][key];
                }
            });
        }

        // 3. Завантаження шапки
        async function loadHeader() {
            try {
                const response = await fetch('header.html');
                if (response.ok) {
                    const html = await response.text();
                    document.getElementById('header-placeholder').outerHTML = html;
                }
            } catch (error) {
                console.error("Помилка завантаження шапки:", error);
            }
        }

        // 4. Завантаження лише готелів із бекенду
        async function loadHotels() {
            try {
                const response = await fetch('/api/establishments/');
                const data = await response.json();
                
                const grid = document.getElementById('establishments-grid');
                if (!grid) return;
                
                grid.innerHTML = '';

                // Фільтруємо заклади, залишаючи тільки готелі
                const hotels = data.filter(item => item.type === 'Hotel');

                if (hotels.length === 0) {
                    grid.innerHTML = '<p class="empty-state">Наразі немає доступних готелів.</p>';
                    return;
                }

                hotels.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => {
                        window.location.href = `/menu.html?id=${item.id}`;
                    };
                    
                    const imageUrl = item.image_url ? item.image_url : 'https://unsplash.com';

                    card.innerHTML = `
                        <div class="card-image"></div>
                        <div class="card-content">
                            <div class="card-type">🏨 Готель</div>
                            <div class="card-title">${item.name}</div>
                            <div class="card-cuisine">${item.cuisine ? item.cuisine : 'Преміум сервіс'}</div>
                            <div class="card-footer">
                                <span>📍 ${item.location}</span>
                                <span class="rating">★ ${item.rating.toFixed(1)}</span>
                            </div>
                        </div>
                    `;
                    card.querySelector('.card-image').style.backgroundImage = `url('${imageUrl}')`;
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error("Помилка завантаження даних:", error);
            }
        }

        // 5. Керування мобільним меню та модалкою
        function toggleMenu() {
            document.getElementById('navbar-links')?.classList.toggle('mobile-active');
            document.getElementById('hamburger-btn')?.classList.toggle('open');
        }

        function closeModal() {
            document.getElementById('booking-modal-overlay')?.classList.remove('active');
        }

        // 6. Ініціалізація
        window.addEventListener('DOMContentLoaded', async () => {
            await loadHeader();
            loadHotels();
            const savedLang = localStorage.getItem('cartel_lang') || 'uk';
            setLanguage(savedLang);
        });
    </script>
</body>
</html>
