<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARTEL — Мережа готелів та ресторанів у Буковелі</title>
    <!-- Підключаємо також шрифт Cinzel для фірмового логотипу та заголовків -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    
    <!-- 🌟 Піднімаємо версію стилів до v=35, щоб примусово оновити мобільний кеш браузера -->
    <link rel="stylesheet" href="/static/style.css?v=39">
</head>
<body class="restaurants-page">

    <!-- 🏛️ Преміум-шапка CARTEL -->
    <div id="header-placeholder"></div>

    <!-- 🌟 УНІВЕРСАЛЬНИЙ HERO-ПЛЕЙСХОЛДЕР (підтягується автоматично з hero.html) -->
    <div id="hero-placeholder"></div>

    <section class="hero" id="restaurants-intro">
        <h1 data-i18n="restaurants_section_title">Наші ресторани у <span>Буковелі</span></h1>
        <p data-i18n="restaurants_section_desc">Авторська кухня, локальні смаки та особлива атмосфера для кожної нагоди.</p>
    </section>

    <!-- 🌟 КОНТЕЙНЕР ДЛЯ КАРТОК -->
    <div class="container">
        <div class="grid" id="establishments-grid">
            <!-- Сюди автоматично завантажуються картки ресторанів -->
        </div>
    </div>

    <!-- ✨ Модальне вікно бронювання -->
    <div class="modal-overlay" id="booking-modal-overlay">
        <div class="modal">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h2 id="modal-title">Бронювання</h2>
            <div class="modal-subtitle" id="modal-establishment-name">Назва закладу</div>
            
            <form id="booking-form" onsubmit="submitBooking(event)">
                <input type="hidden" id="form-establishment-name">
                <div class="form-group">
                    <label>Ваше ім'я</label>
                    <input type="text" id="guest-name" required placeholder="Орест">
                </div>
                <div class="form-group">
                    <label>Номер телефону</label>
                    <input type="tel" id="guest-phone" required placeholder="+380">
                </div>
                <div class="form-group">
                    <label>Дата та час візиту</label>
                    <input type="datetime-local" id="booking-date" required>
                </div>
                <button type="submit" class="btn-submit">Підтвердити бронь</button>
            </form>
        </div>
    </div>

    <!-- 🌟 Скрипти -->
    <script src="/static/hero.js?v=1"></script>
    <script src="/static/restaurants.js?v=35"></script>
    
    <!-- 🏛️ Преміум-футер CARTEL -->
    <div id="footer-placeholder"></div>
</body>
</html>
