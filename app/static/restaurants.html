<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARTEL — Мережа готелів та ресторанів у Буковелі</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant Garamond:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="restaurants-page">

    <!-- 🏛️ Оновлена преміум-шапка CARTEL -->
    <div id="header-placeholder"></div>

    <section class="hero">
        <h1 data-i18n="hero_title">Мережа ресторанів <span>CARTEL</span></h1>
        <p data-i18n="hero_desc">Вишукана гастрономія, авторські концепції від шеф-кухарів та незабутні смакові поєднання в самому серці Карпат.</p>
    </section>  

    <div class="container">
        <div class="grid" id="establishments-grid">
            <!-- Сюди автоматично завантажуються картки -->
        </div>
    </div>

    <!-- ✨ Модальне вікно бронювання -->
    <div class="modal-overlay" id="booking-modal-overlay">
        <div class="modal">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h2 id="modal-title">Бронювання</h2>
            <div class="modal-subtitle" id="modal-establishment-name">Назва закладу</div>
            
            <form id="booking-form" onsubmit="submitBooking(event)">
                <input type="hidden" id="form-establishment-name">
                <div class="form-group">
                    <label>Ваше ім'я</label>
                    <input type="text" id="guest-name" required placeholder="Орест">
                </div>
                <div class="form-group">
                    <label>Номер телефону</label>
                    <input type="tel" id="guest-phone" required placeholder="+380">
                </div>
                <div class="form-group">
                    <label>Дата та час візиту</label>
                    <input type="datetime-local" id="booking-date" required>
                </div>
                <button type="submit" class="btn-submit">Підтвердити бронь</button>
            </form>
        </div>
    </div>

    <script src="/static/restaurants.js"></script>
    <div id="footer-placeholder"></div>
</body>
</html>
