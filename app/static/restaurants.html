<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartel Network — Преміум відпочинок у Буковелі</title>
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #121212;
            color: #E0E0E0;
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
        }

        header {
            padding: 30px 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            color: #D4AF37;
            text-decoration: none;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .hero {
            text-align: center;
            padding: 100px 20px 60px 20px;
        }

        .hero h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 56px;
            font-weight: 600;
            color: #FFF;
            margin-bottom: 20px;
            letter-spacing: 1px;
        }

        .hero p {
            font-size: 16px;
            color: #A0A0A0;
            max-width: 600px;
            margin: 0 auto 40px auto;
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px 100px 40px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 40px;
        }

        .card {
            background: #1A1A1A;
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 4px;
            padding: 30px;
            transition: all 0.4s ease;
            position: relative;
            cursor: pointer;
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: rgba(212, 175, 55, 0.3);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .card-type {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #D4AF37;
            margin-bottom: 15px;
        }

        .card-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 28px;
            color: #FFF;
            margin-bottom: 10px;
        }

        .card-cuisine {
            font-size: 14px;
            color: #888;
            margin-bottom: 20px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 15px;
            font-size: 13px;
            color: #A0A0A0;
        }

        .rating {
            color: #D4AF37;
        }

        /* 🏛️ Стилі для Преміум Модального Вікна */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: #181818;
            border: 1px solid #D4AF37;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
        }

        .modal-close:hover {
            color: #FFF;
        }

        .modal h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            color: #FFF;
            margin-bottom: 5px;
            text-align: center;
        }

        .modal-subtitle {
            font-size: 13px;
            color: #D4AF37;
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            background: #222;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px;
            color: #FFF;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            border-radius: 4px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #D4AF37;
        }

        .btn-submit {
            width: 100%;
            background: #D4AF37;
            color: #121212;
            border: none;
            padding: 15px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background 0.3s;
            margin-top: 10px;
            border-radius: 4px;
        }

        .btn-submit:hover {
            background: #FFF;
        }

        /* Оновлюємо стиль картки, прибираємо внутрішній відступ зверху, щоб фото прилягало ідеально */
        .card {
            background: #1A1A1A;
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 4px;
            padding: 0 0 30px 0; /* Відступ залишаємо тільки знизу та з боків */
            overflow: hidden;    /* Щоб куточки фото згладжувалися по радіусу картки */
            transition: all 0.4s ease;
            position: relative;
            cursor: pointer;
        }

        /* Стиль для контейнера фото */
        .card-image {
            width: 100%;
            height: 200px;
            background-size: cover;
            background-position: center;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
            background-color: #222; /* Заглушка, якщо фото немає */
        }

        /* Повертаємо відступи для текстового контенту всередині картки */
        .card-content {
            padding: 0 30px;
        }
    </style>
</head>
<body>

    <!-- 🏛️ Оновлена преміум-шапка CARTEL -->
    <header style="position: relative; background: #161616;">
        <a href="/" class="logo" style="font-size: 32px; font-weight: 700; color: #FFF; text-decoration: none; letter-spacing: 3px;">CARTEL</a>
        <nav style="display: flex; align-items: center; gap: 25px;">
            <a href="/" style="color: #CCC; text-decoration: none; font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px;">Про нас</a>
            <a href="/restaurants.html" class="active-link" style="border: 1px solid rgba(212, 175, 55, 0.5); color: #D4AF37; text-decoration: none; font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; padding: 8px 12px;">Ресторани</a>
            <a href="#" style="color: #CCC; text-decoration: none; font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px;">Готелі</a>
            <a href="#" style="color: #CCC; text-decoration: none; font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px;">SPA</a>
            <a href="#" style="color: #CCC; text-decoration: none; font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px;">Команда</a>
            <a href="#" style="color: #CCC; text-decoration: none; font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px;">Вакансії</a>
            <a href="#" style="color: #CCC; text-decoration: none; font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px;">Блог</a>
            <a href="#" style="color: #CCC; text-decoration: none; font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px;">Контакти</a>
        </nav>
        <div class="lang-switch" style="font-size: 12px; color: #888; display: flex; gap: 10px;">
            <span style="color: #FFF; font-weight: 600;">UA</span>
            <span>EN</span>
        </div>
    </header>

    <section class="hero">
        <h1>Мережа готелів та ресторанів</h1>
        <p>Преміальні концепції відпочинку, вишукана гастрономія та легендарна атмосфера в самому серці Карпат.</p>
    </section>

    <div class="container">
        <div class="grid" id="establishments-grid">
            <!-- Сюди автоматично завантажуються картки -->
        </div>
    </div>

    <!-- ✨ Модальне вікно бронювання -->
    <div class="modal-overlay" id="booking-modal-overlay">
        <div class="modal">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h2 id="modal-title">Бронювання</h2>
            <div class="modal-subtitle" id="modal-establishment-name">Назва закладу</div>
            
            <form id="booking-form" onsubmit="submitBooking(event)">
                <input type="hidden" id="form-establishment-name">
                <div class="form-group">
                    <label>Ваше ім'я</label>
                    <input type="text" id="guest-name" required placeholder="Орест">
                </div>
                <div class="form-group">
                    <label>Номер телефону</label>
                    <input type="tel" id="guest-phone" required placeholder="+380">
                </div>
                <div class="form-group">
                    <label>Дата та час візиту</label>
                    <input type="datetime-local" id="booking-date" required>
                </div>
                <button type="submit" class="btn-submit">Підтвердити бронь</button>
            </form>
        </div>
    </div>

    <script>
        let currentEstablishment = "";

        async function loadEstablishments() {
            try {
                const response = await fetch('/api/establishments/');
                const data = await response.json();
                
                const grid = document.getElementById('establishments-grid');
                grid.innerHTML = '';

                if(data.length === 0) {
                    grid.innerHTML = '<p style="color: #666;">Наразі немає доданих закладів. Додайте їх через /docs</p>';
                    return;
                }

                data.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    card.onclick = () => {
                        window.location.href = `/menu.html?id=${item.id}`;
                    };
                    // Якщо в базі немає фото, використовуємо красиву темну заглушку
                    const imageUrl = item.image_url ? item.image_url : 'https://unsplash.com';

                    card.innerHTML = `
                        <div class="card-image" style="background-image: url('${imageUrl}')"></div>
                        <div class="card-content">
                            <div class="card-type">${item.type === 'Restaurant' ? '🥩 Ресторан' : '🏨 Готель'}</div>
                            <div class="card-title">${item.name}</div>
                            <div class="card-cuisine">${item.cuisine ? item.cuisine : 'Преміум сервіс'}</div>
                            <div class="card-footer">
                                <span>📍 ${item.location}</span>
                                <span class="rating">★ ${item.rating.toFixed(1)}</span>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            } catch (error) {
                console.error("Помилка завантаження даних:", error);
            }
        }

        function openModal(name, type) {
            currentEstablishment = name;
            document.getElementById('modal-title').innerText = type === 'Restaurant' ? 'Бронювання столика' : 'Резерв номера';
            document.getElementById('modal-establishment-name').innerText = name;
            document.getElementById('form-establishment-name').value = name;
            document.getElementById('booking-modal-overlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('booking-modal-overlay').classList.remove('active');
            document.getElementById('booking-form').reset();
        }

        async function submitBooking(event) {
            event.preventDefault();
            const bookingData = {
                establishment_name: document.getElementById('form-establishment-name').value,
                guest_name: document.getElementById('guest-name').value,
                guest_phone: document.getElementById('guest-phone').value,
                booking_date: document.getElementById('booking-date').value
            };

            try {
                const response = await fetch('/api/bookings/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(bookingData)
                });

                if (response.ok) {
                    alert('Бронювання успішно створено!');
                    closeModal();
                } else {
                    const errorData = await response.json();
                    alert('Помилка при створенні бронювання: ' + (errorData.detail || 'Невідома помилка'));
                }
            } catch (error) {
                console.error("Помилка при відправці даних:", error);
                alert('Помилка при створенні бронювання. Спробуйте ще раз.');
            }
        }

        window.onload = loadEstablishments;
    </script>
</body>
</html>
