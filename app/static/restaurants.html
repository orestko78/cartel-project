<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARTEL — Мережа готелів та ресторанів у Буковелі</title>
    <!-- Підключаємо також шрифт Cinzel для фірмового логотипу та заголовків -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://googleapis.com" rel="stylesheet">
    
    <!-- 🌟 Піднімаємо версію стилів до v=35, щоб примусово оновити мобільний кеш браузера -->
    <link rel="stylesheet" href="/static/style.css?v=35">
</head>
<body class="restaurants-page">

    <!-- 🏛️ Оновлена преміум-шапка CARTEL -->
    <div id="header-placeholder"></div>

    <!-- 🌟 ФОН HERO: Повноформатне фото закладу, зафіксоване на задньому плані сторінки -->
    <div class="establishment-hero-bg" style="position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; background-image: url('/static/images/restaurants.jpg') !important; background-size: cover !important; background-position: center !important; background-repeat: no-repeat !important; z-index: -2 !important; overflow: hidden !important;">
        <div class="video-overlay" style="position: absolute !important; top: 0 !important; left: 0 !important; width: 100% !important; height: 100% !important; background: linear-gradient(to bottom, rgba(11,11,11,0.6) 0%, rgba(11,11,11,0.3) 50%, rgba(11,11,11,0.95) 100%) !important; z-index: -1 !important;"></div>
    </div>

    <!-- 🌟 СЕКЦІЯ HERO: Тепер розгорнута на 100% висоти монітора/телефона (100vh) -->
    <section class="hero" style="height: 100vh !important; min-height: 100vh !important; display: flex !important; flex-direction: column !important; justify-content: center !important; align-items: center !important; position: relative !important; width: 100% !important; margin: 0 !important; padding: 0 20px !important; box-sizing: border-box !important; z-index: 5 !important; background: transparent !important; border: none !important;">
        <h1 data-i18n="hero_title" style="font-family: 'Cinzel', serif !important; font-size: 38px !important; font-weight: 700 !important; color: #ffffff !important; letter-spacing: 3px !important; text-transform: uppercase !important; text-shadow: 0 4px 15px rgba(0,0,0,0.8) !important; margin-bottom: 15px !important; line-height: 1.2 !important;">
            Мережа ресторанів <span style="color: #d4af37 !important;">CARTEL</span>
        </h1>
        <p data-i18n="hero_desc" style="font-family: 'Cormorant Garamond', serif !important; font-size: 18px !important; color: #e0e0e0 !important; max-width: 600px !important; margin: 0 auto !important; line-height: 1.6 !important; text-shadow: 0 2px 8px rgba(0,0,0,0.7) !important;">
            Вишукана гастрономія, авторські концепції від шеф-кухарів та незабутні смакові поєднання в самому серці Карпат.
        </p>

        <!-- Золота стрілка вниз із вашим фірмовим кінематографічним скролом -->
        <div class="scroll-down-arrow" onclick="scrollToFormats()" style="position: absolute !important; bottom: 40px !important; left: 50% !important; transform: translateX(-50%) !important; cursor: pointer !important; z-index: 15 !important;">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#D4AF37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M7 10l5 5 5-5"/>
            </svg>
        </div>
    </section>  

    <!-- 🌟 ВАШ ОРИГІНАЛЬНИЙ КОНТЕЙНЕР (Залишився недоторканим, тому картки сядуть ідеально до країв!) -->
    <div class="container">
        <div class="grid" id="establishments-grid">
            <!-- Сюди автоматично завантажуються картки ресторанів -->
        </div>
    </div>

    <!-- ✨ Модальне вікно бронювання -->
    <div class="modal-overlay" id="booking-modal-overlay">
        <div class="modal">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h2 id="modal-title">Бронювання</h2>
            <div class="modal-subtitle" id="modal-establishment-name">Назва закладу</div>
            
            <form id="booking-form" onsubmit="submitBooking(event)">
                <input type="hidden" id="form-establishment-name">
                <div class="form-group">
                    <label>Ваше ім'я</label>
                    <input type="text" id="guest-name" required placeholder="Орест">
                </div>
                <div class="form-group">
                    <label>Номер телефону</label>
                    <input type="tel" id="guest-phone" required placeholder="+380">
                </div>
                <div class="form-group">
                    <label>Дата та час візиту</label>
                    <input type="datetime-local" id="booking-date" required>
                </div>
                <button type="submit" class="btn-submit">Підтвердити бронь</button>
            </form>
        </div>
    </div>

    <!-- 🌟 Піднімаємо версію скрипту для миттєвого оновлення пам'яті -->
    <script src="/static/restaurants.js?v=35"></script>
    <div id="footer-placeholder"></div>
</body>
</html>
