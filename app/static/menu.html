<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Меню закладу — Cartel Network</title>
    <!-- Підключаємо фірмові преміум-шрифти -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Головний файл стилів усього проєкту -->
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="menu-page-body">

    <!-- Динамічна шапка сайту CARTEL -->
    <div id="header-placeholder"></div>

    <div class="menu-container-premium">
        <h1 class="restaurant-title-main" id="rest-name">Завантаження...</h1>
        <div class="menu-subtitle-main">Фірмові страви та шедеври кухні</div>

        <!-- Контейнер сітки, куди JavaScript вставляє лофт-картки -->
        <div id="menu-items-list"></div>

        <button class="btn-order-table" onclick="openModal()">Забронювати стіл</button>
    </div>

    <!-- ✨ Модальне вікно онлайн-бронювання -->
    <div class="modal-overlay" id="booking-modal-overlay">
        <div class="modal">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h2>Бронювання</h2>
            <div class="menu-subtitle-main" style="margin-bottom: 20px;" id="modal-establishment-name">Назва закладу</div>
            
            <form id="booking-form" onsubmit="submitBooking(event)">
                <div class="form-group">
                    <label>Ваше ім'я</label>
                    <input type="text" id="guest-name" required placeholder="Орест">
                </div>
                <div class="form-group">
                    <label>Номер телефону</label>
                    <input type="tel" id="guest-phone" required placeholder="+380">
                </div>
                <div class="form-group">
                    <label>Дата та час візиту</label>
                    <input type="datetime-local" id="booking-date" required>
                </div>
                <button type="submit" class="btn-submit">Підтвердити бронь</button>
            </form>
        </div>
    </div>

    <!-- Динамічний підвал сайту CARTEL -->
    <div id="footer-placeholder"></div>

    <script src="/static/menu.js"></script>
</body>
</html>
