<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Меню закладу — Cartel Network</title>
    <!-- Підключаємо фірмові преміум-шрифти -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #121212; /* Глибокий антрацитовий колір */
            color: #E0E0E0;
            font-family: 'Montserrat', sans-serif;
        }

        /* Навігаційна панель */
        header {
            padding: 30px 10%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(212, 175, 55, 0.1);
        }

        .btn-back {
            color: #A0A0A0;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

        .btn-back:hover {
            color: #D4AF37;
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            color: #D4AF37; /* Шляхетне золото */
            text-decoration: none;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Контейнер ресторанного меню */
        .menu-container {
            max-width: 900px;
            margin: 60px auto 100px auto;
            padding: 0 20px;
        }

        .restaurant-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 48px;
            text-align: center;
            color: #FFF;
            margin-bottom: 10px;
        }

        .menu-subtitle {
            font-size: 13px;
            color: #D4AF37;
            text-align: center;
            margin-bottom: 50px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Список страв у стилі глянцевого меню */
        .menu-list {
            display: flex;
            flex-direction: column;
            gap: 35px;
        }

        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            position: relative;
        }

        .item-info {
            max-width: 75%;
        }

        .item-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px;
            color: #FFF;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .item-description {
            font-size: 13px;
            color: #888;
            line-height: 1.5;
        }

        /* Тонка пунктирна лінія-роздільник */
        .item-dots {
            flex-grow: 1;
            border-bottom: 1px dotted rgba(255, 255, 255, 0.15);
            margin: 0 15px 7px 15px;
            align-self: flex-end;
        }

        .item-price {
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px;
            color: #D4AF37;
            font-weight: 600;
            white-space: nowrap;
        }

        /* Головна кнопка виклику форми */
        .btn-order-table {
            display: block;
            width: 250px;
            background: #D4AF37;
            color: #121212;
            border: none;
            padding: 15px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            text-align: center;
            margin: 60px auto 0 auto;
            border-radius: 4px;
            transition: all 0.3s;
        }

        .btn-order-table:hover {
            background: #FFF;
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.2);
        }

        /* 🏛️ Модальне вікно преміум-класу */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(8px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 1000;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: #181818;
            border: 1px solid #D4AF37;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            border-radius: 4px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            color: #888;
            font-size: 24px;
            cursor: pointer;
            transition: color 0.3s;
        }

        .modal-close:hover {
            color: #FFF;
        }

        .modal h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            color: #FFF;
            margin-bottom: 5px;
            text-align: center;
        }

        /* Поля введення форми */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .form-group input {
            width: 100%;
            background: #222;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 12px;
            color: #FFF;
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            border-radius: 4px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #D4AF37;
        }

        .btn-submit {
            width: 100%;
            background: #D4AF37;
            color: #121212;
            border: none;
            padding: 15px;
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            border-radius: 4px;
            transition: background 0.3s;
        }

        .btn-submit:hover {
            background: #FFF;
        }
    </style>
</head>
<body>

    <header>
        <a href="/" class="btn-back">← На головну</a>
        <a href="/" class="logo">Cartel</a>
        <div style="width: 80px;"></div> <!-- Для центрування флексу -->
    </header>

    <div class="menu-container">
        <h1 class="restaurant-title" id="rest-name">Завантаження...</h1>
        <div class="menu-subtitle">Фірмові страви та шедеври кухні</div>

        <div class="menu-list" id="menu-items-list">
            <!-- Сюди за допомогою JavaScript завантажуються страви з Python -->
        </div>

        <button class="btn-order-table" onclick="openModal()">Забронювати стіл</button>
    </div>

    <!-- ✨ Модальне вікно онлайн-бронювання -->
    <div class="modal-overlay" id="booking-modal-overlay">
        <div class="modal">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h2>Бронювання</h2>
            <div class="menu-subtitle" style="margin-bottom: 20px;" id="modal-establishment-name">Назва закладу</div>
            
            <form id="booking-form" onsubmit="submitBooking(event)">
                <div class="form-group">
                    <label>Ваше ім'я</label>
                    <input type="text" id="guest-name" required placeholder="Орест">
                </div>
                <div class="form-group">
                    <label>Номер телефону</label>
                    <input type="tel" id="guest-phone" required placeholder="+380">
                </div>
                <div class="form-group">
                    <label>Дата та час візиту</label>
                    <input type="datetime-local" id="booking-date" required>
                </div>
                <button type="submit" class="btn-submit">Підтвердити бронь</button>
            </form>
        </div>
    </div>

    <script>
        const establishmentId = new URLSearchParams(window.location.search).get('id');
        let restaurantName = 'Заклад';

        async function loadMenu() {
            const listContainer = document.getElementById('menu-items-list');

            if (!establishmentId) {
                document.getElementById('rest-name').textContent = 'Заклад не знайдено';
                listContainer.innerHTML = '<p class="item-description">Відкрийте меню зі сторінки закладів.</p>';
                return;
            }

            try {
                const [establishmentResponse, menuResponse] = await Promise.all([
                    fetch('/api/establishments/'),
                    fetch(`/api/menu/${encodeURIComponent(establishmentId)}`)
                ]);

                if (!establishmentResponse.ok || !menuResponse.ok) {
                    throw new Error('Не вдалося отримати дані меню');
                }

                const establishments = await establishmentResponse.json();
                const menuItems = await menuResponse.json();
                const establishment = establishments.find(item => String(item.id) === establishmentId);

                restaurantName = establishment?.name || 'Меню закладу';
                document.getElementById('rest-name').textContent = restaurantName;
                document.getElementById('modal-establishment-name').textContent = restaurantName;

                if (menuItems.length === 0) {
                    listContainer.innerHTML = '<p class="item-description">У меню поки немає страв.</p>';
                    return;
                }

                listContainer.innerHTML = '';
                menuItems.forEach(item => {
                    const itemElement = document.createElement('div');
                    itemElement.className = 'menu-item';
                    
                    // Якщо фото для страви не додано, використовуємо мінімалістичну темну заглушку
                    const dishImg = item.image_url ? item.image_url : 'https://unsplash.com';

                    itemElement.innerHTML = `
                        <!-- Новий блок для фото страви -->
                        <img src="${dishImg}" alt="${item.name}" style="width: 80px; height: 80px; object-fit: cover; border-radius: 4px; margin-right: 20px; border: 1px solid rgba(212, 175, 55, 0.2);">
                        
                        <div class="item-info">
                            <div class="item-name">${item.name}</div>
                            <div class="item-description">${item.description ? item.description : ''}</div>
                        </div>
                        <div class="item-dots"></div>
                        <div class="item-price">${item.price} грн</div>
                    `;
                    listContainer.appendChild(itemElement);
                });

            } catch (error) {
                console.error('Помилка завантаження меню:', error);
                document.getElementById('rest-name').textContent = 'Помилка завантаження';
                listContainer.innerHTML = '<p class="item-description">Не вдалося завантажити меню. Спробуйте ще раз.</p>';
            }
        }

        function openModal() {
            document.getElementById('booking-modal-overlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('booking-modal-overlay').classList.remove('active');
            document.getElementById('booking-form').reset();
        }

        async function submitBooking(event) {
            event.preventDefault();
            const bookingData = {
                establishment_name: restaurantName,
                guest_name: document.getElementById('guest-name').value,
                guest_phone: document.getElementById('guest-phone').value,
                booking_date: document.getElementById('booking-date').value
            };

            try {
                const response = await fetch('/api/bookings/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(bookingData)
                });
                const result = await response.json();

                if (!response.ok) {
                    throw new Error(result.detail || 'Не вдалося створити бронювання');
                }

                alert(`Бронювання в закладі «${restaurantName}» створено.`);
                closeModal();
            } catch (error) {
                console.error('Помилка відправки замовлення:', error);
                alert(error.message || 'Не вдалося надіслати заявку на сервер.');
            }
        }

        window.addEventListener('click', event => {
            if (event.target === document.getElementById('booking-modal-overlay')) {
                closeModal();
            }
        });

        window.addEventListener('load', loadMenu);
    </script>
