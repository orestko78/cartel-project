<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Меню закладу — Cartel Network</title>
    <!-- Підключаємо фірмові преміум-шрифти -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Підключаємо фірмові преміум-стилі -->
    <link rel="stylesheet" href="/static/style.css?v=4">
</head>
<body class="menu-page-body">

    <!-- 🏛️ Динамічна шапка сайту CARTEL -->
    <div id="header-placeholder"></div>

    <!-- 🌌 Преміальний головний екран Hero-вікна -->
    <section class="menu-hero">
        <div class="menu-hero-overlay"></div>
        <div class="menu-hero-content">
            <h1 class="restaurant-title-main" id="rest-name">Завантаження...</h1>
            <div class="menu-subtitle-main">Фірмові страви та шедеври кухні</div>
        </div>
        <button class="scroll-down-arrow" type="button" onclick="scrollToMenuContent()" aria-label="Перейти до меню">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M7 10l5 5 5-5"/>
            </svg>
        </button>
    </section>

    <div class="menu-container-premium" id="menu-content">
        
        <!-- 🌟 НОВИЙ БЛОК: Преміальна горизонтальна стрічка категорій CARTEL -->
        <div id="menu-categories-tabs" style="display: flex; justify-content: center; gap: 15px; flex-wrap: wrap; margin: 30px 0 50px 0; width: 100%;">
            <!-- Сюди JS автоматично підставить кнопки («Фірмові страви», «Гарніри» тощо) -->
        </div>

        <!-- Головний чистий контейнер для категорій меню -->
        <div id="menu-categories-container"></div>

        <button class="btn-order-table" onclick="openModal()" style="margin-top: 50px;">Забронювати стіл</button>
    </div>


    <!-- ✨ Модальне вікно онлайн-бронювання -->
    <div class="modal-overlay" id="booking-modal-overlay">
        <div class="modal">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h2>Бронювання</h2>
            <div class="menu-subtitle-main" style="margin-bottom: 20px;" id="modal-establishment-name">Назва закладу</div>
            
            <form id="booking-form" onsubmit="submitBooking(event)">
                <div class="form-group">
                    <label>Ваше ім'я</label>
                    <input type="text" id="guest-name" required placeholder="Орест">
                </div>
                <div class="form-group">
                    <label>Номер телефону</label>
                    <input type="tel" id="guest-phone" required placeholder="+380">
                </div>
                <div class="form-group">
                    <label>Дата та час візиту</label>
                    <input type="datetime-local" id="booking-date" required>
                </div>
                <button type="submit" class="btn-submit">Підтвердити бронь</button>
            </form>
        </div>
    </div>

    <!-- 🏛️ Динамічний підвал сайту CARTEL -->
    <div id="footer-placeholder"></div>

    <!-- Окремий файл логіки меню, який керує сторінкою -->
    <script src="/static/menu.js?v=6"></script>
</body>
</html>
