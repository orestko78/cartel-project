<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARTEL — Мережа готелів та ресторанів у Буковелі</title>
    <link href="https://googleapis.com" rel="stylesheet">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0b0b0b;
            color: #FFF;
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
        }

        /* 🏛️ Шапка */
        header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 25px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 100;
        }

        .logo {
            font-size: 32px;
            font-weight: 700;
            color: #FFF;
            text-decoration: none;
            letter-spacing: 3px;
            z-index: 102;
        }

        /* Меню навігації для комп'ютера */
        nav {
            display: flex;
            align-items: center;
            gap: 25px;
            transition: right 0.4s ease;
        }

        nav a {
            color: #CCC;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.3s ease;
            padding: 8px 12px;
        }

        nav a:hover {
            color: #FFF;
        }

        nav a.active-link {
            border: 1px solid rgba(212, 175, 55, 0.5);
            color: #D4AF37;
        }

        .lang-switch {
            font-size: 12px;
            color: #888;
            display: flex;
            gap: 10px;
            z-index: 102;
        }

        .lang-switch span.active-lang {
            color: #FFF;
            font-weight: 600;
        }

        /* 🍔 Кнопка бутерброд */
        .hamburger {
            display: none;
            flex-direction: column;
            justify-content: space-between;
            width: 30px;
            height: 20px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0;
            z-index: 102;
        }

        .hamburger span {
            width: 100%;
            height: 3px;
            background-color: #FFF;
            transition: all 0.3s ease;
        }

        /* 🏔️ Героїчна секція */
        .hero-section {
            position: relative;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
            z-index: 10;
        }

        /* 📹 Відео-бекграунд */
        .video-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            z-index: 1;
        }

        .video-background video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.65);
            z-index: 2;
        }

        .hero-section h1 {
            font-size: 50px;
            font-weight: 300;
            letter-spacing: 5px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .hero-section h1 span {
            font-weight: 600;
            color: #D4AF37;
        }

        .hero-section p {
            font-size: 16px;
            color: #CCC;
            max-width: 700px;
            line-height: 1.8;
            margin-bottom: 40px;
            font-weight: 300;
        }

        .btn-discover {
            display: inline-block;
            padding: 15px 40px;
            border: 1px solid #D4AF37;
            color: #D4AF37;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 2px;
            transition: all 0.4s ease;
            background: transparent;
            border-radius: 4px;
        }

        .btn-discover:hover {
            background: #D4AF37;
            color: #000;
            box-shadow: 0 0 25px rgba(212, 175, 55, 0.4);
        }

        /* 📱 НАЛАШТУВАННЯ ПРОЗОРОГО МЕНЮ НА ТЕЛЕФОНІ */
        @media (max-width: 991px) {
            .hamburger {
                display: flex;
            }

            .lang-switch {
                display: none;
            }

            nav {
                position: fixed;
                top: 0;
                right: -100%;
                width: 280px;
                height: 100vh;
                
                /* ✨ НАПІВПРОЗОРИЙ ФОН ТА ЕФЕКТ РОЗМИРТТЯ ДЛЯ БУТЕРБРОДА */
                background: rgba(18, 18, 18, 0.90); /* Прозорість 75% */
                backdrop-filter: blur(15px);        /* Красиве розмиття відео на фоні */
                -webkit-backdrop-filter: blur(15px); /* Підтримка для iPhone (Safari) */
                
                border-left: 1px solid rgba(212, 175, 55, 0.2);
                flex-direction: column;
                justify-content: center;
                gap: 20px;
                padding: 40px;
                z-index: 101;
            }

            nav.mobile-active {
                right: 0;
            }

            nav a {
                font-size: 16px;
                width: 100%;
                text-align: center;
            }

            .hamburger.open span:nth-child(1) {
                transform: rotate(45deg) translate(5px, 5px);
            }
            .hamburger.open span:nth-child(2) {
                opacity: 0;
            }
            .hamburger.open span:nth-child(3) {
                transform: rotate(-45deg) translate(7px, -7px);
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="/" class="logo">CARTEL</a>
        
        <nav id="navbar-links">
            <a href="/">Про нас</a>
            <a href="/restaurants.html" class="active-link">Ресторани</a>
            <a href="#">Готелі</a>
            <a href="#">SPA</a>
            <a href="#">Команда</a>
            <a href="#">Вакансії</a>
            <a href="#">Блог</a>
            <a href="#">Контакти</a>
        </nav>

        <button class="hamburger" id="hamburger-btn" onclick="toggleMenu()">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <div class="lang-switch">
            <span class="active-lang">UA</span>
            <span>EN</span>
        </div>
    </header>

    <div class="video-background">
        <div class="video-overlay"></div>
        <video autoplay loop muted playsinline>
            <source src="/images/bg_video.mp4" type="video/mp4">
        </video>
    </div>

    <section class="hero-section">
        <h1>Сім'я ресторанів <span>CARTEL</span></h1>
        <p>Головний operator розваг та гастрономії на курорті Буковель. Ми створюємо преміальні концепції відпочинку, поєднуючи карпатські традиції з європейським сервісом люкс-класу.</p>
        <a href="/restaurants.html" class="btn-discover">Відкрити заклади</a>
    </section>

    <script>
        function toggleMenu() {
            document.getElementById('navbar-links').classList.toggle('mobile-active');
            document.getElementById('hamburger-btn').classList.toggle('open');
        }
    </script>

</body>
</html>
