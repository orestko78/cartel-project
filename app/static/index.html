<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CARTEL — Мережа готелів та ресторанів</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

    <div id="header-placeholder"></div>

    <div class="video-background">
        <div class="video-overlay"></div>
        <video autoplay loop muted playsinline webkit-playsinline preload="metadata" poster="images/rebra.jpg" aria-hidden="true">
            <source src="images/bg_video.mp4" type="video/mp4">
        </video>
    </div>

    <section class="hero-section" id="hero-content">
        <!-- Тексти також отримали атрибут data-i18n -->
        <h1 data-i18n="hero_title">Мережа готелів та ресторанів</h1>
        <p data-i18n="hero_desc">Преміальні концепції відпочинку, вишукана гастрономія та легендарна атмосфера в самому серці Карпат.</p>
    </section>

    <script>
    // 1. Словник перекладів
    const translations = {
        uk: {
            nav_about: "Про нас",
            nav_restaurants: "Ресторани",
            nav_hotels: "Готелі",
            nav_spa: "SPA",
            nav_team: "Команда",
            nav_jobs: "Вакансії",
            nav_blog: "Блог",
            nav_contact: "Контакти",
            hero_title: "Мережа готелів та ресторанів",
            hero_desc: "Преміальні концепції відпочинку, вишукана гастрономія та легендарна атмосфера в самому серці Карпат."
        },
        en: {
            nav_about: "About Us",
            nav_restaurants: "Restaurants",
            nav_hotels: "Hotels",
            nav_spa: "SPA",
            nav_team: "Team",
            nav_jobs: "Careers",
            nav_blog: "Blog",
            nav_contact: "Contacts",
            hero_title: "Hotels & Restaurants Network",
            hero_desc: "Premium leisure concepts, exquisite gastronomy, and a legendary atmosphere in the heart of the Carpathians."
        }
    };

    // 2. Функція зміни мови
    function setLanguage(lang) {
        localStorage.setItem('cartel_lang', lang);

        document.querySelectorAll('[data-i18n]').forEach(element => {
            const key = element.getAttribute('data-i18n');
            if (translations[lang] && translations[lang][key]) {
                element.textContent = translations[lang][key];
            }
        });

        const langUk = document.getElementById('lang-uk');
        const langEn = document.getElementById('lang-en');
        if (langUk && langEn) {
            langUk.classList.remove('active-lang');
            langEn.classList.remove('active-lang');
            document.getElementById('lang-' + lang).classList.add('active-lang');
        }
    }

    // 3. Завантаження шапки з окремого файлу
    async function loadHeader() {
        try {
            const response = await fetch('header.html');
            if (response.ok) {
                const html = await response.text();
                const placeholder = document.getElementById('header-placeholder');
                if (placeholder) {
                    placeholder.outerHTML = html;
                }
            }
        } catch (error) {
            console.error("Помилка завантаження шапки:", error);
        }
    }

    // 4. Завантаження закладів із бекенду
    async function loadEstablishments() {
        try {
            const response = await fetch('/api/establishments/');
            const data = await response.json();
            
            const grid = document.getElementById('establishments-grid');
            if (!grid) return;
            
            grid.innerHTML = '';

            if (data.length === 0) {
                grid.innerHTML = '<p class="empty-state">Наразі немає доданих закладів. Додайте їх через /docs</p>';
                return;
            }

            data.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => {
                    window.location.href = `/menu.html?id=${item.id}`;
                };
                
                const imageUrl = item.image_url ? item.image_url : 'https://unsplash.com';

                card.innerHTML = `
                    <div class="card-image"></div>
                    <div class="card-content">
                        <div class="card-type">${item.type === 'Restaurant' ? '🥩 Ресторан' : '🏨 Готель'}</div>
                        <div class="card-title">${item.name}</div>
                        <div class="card-cuisine">${item.cuisine ? item.cuisine : 'Преміум сервіс'}</div>
                        <div class="card-footer">
                            <span>📍 ${item.location}</span>
                            <span class="rating">★ ${item.rating.toFixed(1)}</span>
                        </div>
                    </div>
                `;
                card.querySelector('.card-image').style.backgroundImage = `url('${imageUrl}')`;
                grid.appendChild(card);
            });
        } catch (error) {
            console.error("Помилка завантаження даних:", error);
        }
    }

    // 5. Управління модальним вікном бронювання
    function openModal(name, type) {
        document.getElementById('modal-title').innerText = type === 'Restaurant' ? 'Бронювання столика' : 'Резерв номера';
        document.getElementById('modal-establishment-name').innerText = name;
        document.getElementById('form-establishment-name').value = name;
        document.getElementById('booking-modal-overlay').classList.add('active');
    }

    function closeModal() {
        document.getElementById('booking-modal-overlay').classList.remove('active');
        document.getElementById('booking-form').reset();
    }

    async function submitBooking(event) {
        event.preventDefault();
        const bookingData = {
            establishment_name: document.getElementById('form-establishment-name').value,
            guest_name: document.getElementById('guest-name').value,
            guest_phone: document.getElementById('guest-phone').value,
            booking_date: document.getElementById('booking-date').value
        };

        try {
            const response = await fetch('/api/bookings/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(bookingData)
            });

            if (response.ok) {
                alert('Бронювання успішно створено!');
                closeModal();
            } else {
                const errorData = await response.json();
                alert('Помилка при створенні бронювання: ' + (errorData.detail || 'Невідома помилка'));
            }
        } catch (error) {
            console.error("Помилка при відправці даних:", error);
            alert('Помилка при створенні бронювання. Спробуйте ще раз.');
        }
    }

    // 6. Мобільне меню
    function toggleMenu() {
        const links = document.getElementById('navbar-links');
        const hamburger = document.getElementById('hamburger-btn');
        if (links) links.classList.toggle('mobile-active');
        if (hamburger) hamburger.classList.toggle('open');
    }

    // 7. Головна ініціалізація при завантаженні сторінки
    window.addEventListener('DOMContentLoaded', async () => {
        await loadHeader();
        loadEstablishments();

        const savedLang = localStorage.getItem('cartel_lang') || 'uk';
        setLanguage(savedLang);
    });

    // 8. Логіка автоприховування інтерфейсу (UI)
    let inactivityTimeout;

    function showUI() {
        const header = document.getElementById('main-header');
        const hero = document.getElementById('hero-content');
        
        if (header) header.classList.remove('hidden-ui');
        if (hero) hero.classList.remove('hidden-ui');
        
        clearTimeout(inactivityTimeout);
        
        inactivityTimeout = setTimeout(() => {
            const links = document.getElementById('navbar-links');
            const isMobileMenuOpen = links && links.classList.contains('mobile-active');
            if (!isMobileMenuOpen) {
                if (header) header.classList.add('hidden-ui');
                if (hero) hero.classList.add('hidden-ui');
            }
        }, 2500);
    }

    document.addEventListener("DOMContentLoaded", function() {
        const video = document.querySelector("video");
        if (video) {
            video.play().catch(error => {
                console.log("Автозапуск відео заблоковано браузером:", error);
            });
        }
    });

    window.addEventListener('mousemove', showUI);
    window.addEventListener('click', showUI);
    showUI();
</script>

</body>
</html>
