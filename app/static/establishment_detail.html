<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заклад — Cartel</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <!-- Шапка сайту (завантажується автоматично) -->
    <div id="header-placeholder"></div>

    <!-- Повноноекранний блок фонового зображення інтер'єру -->
    <div class="establishment-hero-bg" id="establishment-hero-bg" style="position: fixed !important; top: 0 !important; left: 0 !important; width: 100vw !important; height: 100vh !important; background-size: cover !important; background-position: center center !important; background-repeat: no-repeat !important; z-index: -2 !important; overflow: hidden !important;">
        <div class="video-overlay" style="position: absolute !important; top: 0 !important; left: 0 !important; width: 100% !important; height: 100% !important; background: linear-gradient(to bottom, rgba(18,18,18,0.7) 0%, rgba(18,18,18,0.4) 60%, rgba(12,12,13,0.95) 100%) !important; z-index: -1 !important;"></div>
    </div>

    <!-- HERO-КОНТЕНТ: Великий заголовок строго по центру вашого вікна -->
    <section class="hero-section" id="establishment-hero-content" style="height: 100vh !important; min-height: 100vh !important; display: flex !important; flex-direction: column !important; justify-content: center !important; align-items: center !important; position: relative !important; width: 100% !important; margin: 0 !important; padding: 0 20px !important; box-sizing: border-box !important; z-index: 5 !important;">
        <h1 id="detail-title" style="margin-bottom: 10px;">Завантаження...</h1>
        <p id="detail-cuisine">Мережа готелів та ресторанів CARTEL</p>
        
        <!-- Стрілка вниз для прокрутки -->
        <div class="scroll-down-arrow" onclick="scrollToFormats()">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#D4AF37" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M7 10l5 5 5-5"/>
            </svg>
        </div>
    </section>

    <!-- Головний виїзний контейнер до країв екрана -->
    <main class="establishment-detail-container" style="width: 100vw !important; max-width: 100vw !important; margin: 0 !important; padding: 0 !important; box-sizing: border-box !important; position: relative !important; z-index: 10 !important;">
        
        <!-- Преміальна матова плашка з розмиттям фону -->
        <section class="paris-style-intro"
            <div class="paris-intro-inner">
                
                <!-- 🌟 Постійний преміум заголовок-категорія -->
                <h2 id="detail-subtitle" class="paris-title">ЗАКЛАД, ЩО ПОРУШУЄ СТАНДАРТИ</h2>
                
                <!-- 🌟 Контейнер, куди JavaScript вставить опис, кнопки швидких дій, бронь та карту в ідеальному порядку -->
                <div id="establishment-content" style="background: transparent !important;">
                    <p style="color: #aaa; text-align: left;">Завантаження інформації про закладення...</p>
                </div>
                
            </div>
        </section>

        <!-- Блок меню -->
        <div id="menu-section" style="width: 100% !important; max-width: 1200px !important; margin-left: auto !important; margin-right: auto !important; padding-left: 20px !important; padding-right: 20px !important; box-sizing: border-box !important;"></div>
    </main>

    <!-- Модальне вікно онлайн-бронювання -->
    <div id="booking-modal-overlay" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <h2 id="modal-title">Бронювання столика</h2>
            <p id="modal-establishment-name" class="modal-subtitle"></p>
            
            <form id="booking-form" onsubmit="submitBooking(event)">
                <input type="hidden" id="form-establishment-name">
                <div class="form-group">
                    <label for="guest-name">Ваше ім'я</label>
                    <input type="text" id="guest-name" required placeholder="Введіть ваше ім'я">
                </div>
                <div class="form-group">
                    <label for="guest-phone">Номер телефону</label>
                    <input type="tel" id="guest-phone" required placeholder="+38 (050) 000-00-00">
                </div>
                <div class="form-group">
                    <label for="booking-date">Дата та час</label>
                    <input type="datetime-local" id="booking-date" required>
                </div>
                <button type="submit" class="btn-submit-booking">Підтвердити бронювання</button>
            </form>
        </div>
    </div>
    
    <!-- Підключення скрипту з унікальним номером версії від кешування -->
    <script src="/static/establishment_detail.js?v=2001"></script>
    <div id="footer-placeholder"></div>

</body>
</html>
